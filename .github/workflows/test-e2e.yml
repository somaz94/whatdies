name: E2E Tests

on:
  # Same push filter as ci.yml, so a topic branch does not create a kind cluster
  # on every push and again for its pull request.
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E Suite
    # Fork PRs run once the ok-to-test label is on them. Any other label is no
    # reason to run.
    if: >
      (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       contains(github.event.pull_request.labels.*.name, 'ok-to-test'))
    # On the job, not the workflow: a run whose job the condition above skips
    # would still join a workflow-level group and cancel the run in progress.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # The wrapper reprints terraform's output and hides its exit code.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # install_only leaves creating the cluster to the demo, which names it.
      - name: Install kind
        uses: helm/kind-action@v1.15.2
        with:
          install_only: true

      - name: Run the demo and compare the verdicts
        run: make e2e
